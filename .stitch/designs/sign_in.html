<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-terracotta mb-4">
                Catalogify
            </h1>
<p class="font-body-md text-body-md text-espresso opacity-80 italic mb-12">
                "Curate your world, one heirloom at a time."
            </p>
<!-- Image Asset for Branding/Vibe -->
<div class="mb-12 relative group">
<div class="aspect-[4/3] w-full overflow-hidden rounded-lg border border-espresso/10">

</div>

<p class="font-label-sm text-label-sm text-espresso opacity-50 tracking-widest uppercase">
            A digital heirloom platform
        </p>

<script>
        // Simple micro-interaction for the sign-in container
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.animate-fade-in');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            container.style.transition = 'opacity 1s ease-out, transform 1s ease-out';
            
            setTimeout(() => {
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
